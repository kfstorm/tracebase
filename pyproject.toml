[project]
name = "tracebase"
version = "0.1.0"
description = "Private, replayable activity archive foundations"
authors = [
    { name = "Kai Yang", email = "kfstorm@outlook.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tracebase = "tracebase:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=3.0.0",
    "pymarkdownlnt>=0.9.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.8.0",
    "tach>=0.30.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/tracebase --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
files = ["src"]
explicit_package_bases = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
show_error_codes = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py314"
line-length = 88
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "PTH",
    "PL",
    "PERF",
    "RUF",
]
ignore = [
    "PLR0912", # Snapshot validation is intentionally a single fail-fast workflow.
    "PLR0913", # Collection Run construction requires explicit archive metadata.
    "PLR0917", # Collection Run construction requires explicit archive metadata.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.vulture]
paths = ["src", "tests"]

[tool.pymarkdown.plugins.md013]
enabled = false

[tool.pymarkdown.plugins.md036]
enabled = false

[tool.pymarkdown.plugins.md040]
enabled = false

[tool.pymarkdown.plugins.md041]
enabled = false
