[project]
name = "tracebase"
version = "0.1.0"
description = "Private, replayable activity archive foundations"
authors = [
    { name = "Kai Yang", email = "kfstorm@outlook.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tracebase = "tracebase:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
